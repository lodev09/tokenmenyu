name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP: TokenMenyu
  APP_NAME: TokenMenyu
  IDENTITY: ${{ secrets.APPLE_IDENTITY }}
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  release:
    # macOS 26 SDK required for the Liquid Glass MenuBarExtra appearance
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

      - name: Build
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -project TokenMenyu.xcodeproj -scheme TokenMenyu -configuration Release \
            -derivedDataPath .build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=${GITHUB_REF_NAME#v} \
            build

      - name: Bundle and sign
        run: |
          mkdir -p dist
          cp -R ".build/Build/Products/Release/$APP_NAME.app" "dist/$APP_NAME.app"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "dist/$APP_NAME.app"

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir dist/dmg
          cp -R "dist/$APP_NAME.app" dist/dmg/
          create-dmg \
            --volname "TokenMenyu" \
            --volicon AppIcon.icns \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "$APP_NAME.app" 140 185 \
            --app-drop-link 400 185 \
            --no-internet-enable \
            dist/$APP.dmg dist/dmg
          codesign --force --timestamp --sign "$IDENTITY" dist/$APP.dmg

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit dist/$APP.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple dist/$APP.dmg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/$APP.dmg --title "$GITHUB_REF_NAME" --generate-notes
